<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Fiche spectateur</title><style>
:root{--bg:#f4f7fb;--card:#fff;--ink:#17212b;--muted:#687684;--line:#d7e0ea;--blue:#356da8;--soft:#eaf2fb;--ok:#18765e;--danger:#b83232;--r:16px}*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:var(--bg);color:var(--ink)}.wrap{max-width:1100px;margin:auto;padding:14px 14px 80px}.header{position:sticky;top:0;z-index:20;background:rgba(244,247,251,.95);backdrop-filter:blur(8px);border-bottom:1px solid var(--line);padding:10px 0;margin-bottom:14px}.row{display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap}h1{font-size:clamp(26px,6vw,42px);margin:18px 0 6px}h2{font-size:21px;margin:0}.card{background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:16px;box-shadow:0 6px 22px rgba(20,40,70,.06)}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.meta{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.btn{border:0;border-radius:11px;padding:10px 14px;font-weight:700;background:#e5ebf2;color:#213249;cursor:pointer}.btn.primary{background:var(--blue);color:#fff}.btn.ok{background:var(--ok);color:#fff}.btn.danger{background:#fff0f0;color:var(--danger);border:1px solid #f1c9c9}.btn.big{width:100%;padding:14px;font-size:17px}label{font-weight:700;font-size:13px;display:block;margin:8px 0 5px}input[type=text],input[type=date],input[type=number],textarea{width:100%;border:1px solid #c7d2dd;border-radius:10px;padding:10px;background:#fff;color:var(--ink);font:inherit}textarea{min-height:78px;resize:vertical}.small{font-size:12px;color:var(--muted)}.section{margin:25px 0 10px;display:flex;justify-content:space-between;align-items:center;gap:10px}.pills{display:flex;flex-wrap:wrap;gap:7px}.pill{position:relative}.pill input{position:absolute;opacity:0}.pill span{display:inline-block;border:1px solid #cfd8e3;border-radius:999px;padding:7px 10px;background:#fff;font-size:13px}.pill input:checked+span{background:var(--soft);border-color:#79a4d0;color:#174b80;font-weight:700}details{background:#fff;border:1px solid var(--line);border-radius:14px;margin:10px 0;overflow:hidden}summary{cursor:pointer;font-weight:800;padding:13px 15px;background:#f9fbfd}.inner{padding:14px}.moves{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.move{border:1px solid var(--line);border-radius:12px;padding:8px;background:#fbfcfe}.n{font-weight:800;font-size:12px;color:var(--muted);margin-bottom:6px}canvas{display:block;width:100%;height:105px;background:#fff;border:1px dashed #aab8c5;border-radius:8px;touch-action:none}.mini{font-size:11px;padding:5px 8px;border:1px solid var(--line);background:#fff;border-radius:8px;cursor:pointer;margin-top:5px}.sub{padding-top:12px;margin-top:12px;border-top:1px solid #edf1f5}.sub h4{margin:0 0 7px}.formations,.procs{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.form,.proc{border:1px solid var(--line);border-radius:12px;padding:9px;background:#fff}.diag{white-space:pre;text-align:center;font-family:monospace;min-height:30px;color:#32485e}.formline{display:flex;align-items:center;gap:6px}.formline input[type=number]{width:58px;padding:5px}.proc b{display:block;margin-bottom:4px}.proc small{display:block;line-height:1.35;color:var(--muted)}.method{display:grid;grid-template-columns:42px 1fr;border:1px solid var(--line);border-radius:12px;overflow:hidden}.method .num{background:#4f79aa;color:#fff;font-weight:800;display:flex;align-items:center;justify-content:center;border-bottom:1px solid rgba(255,255,255,.25)}.method .txt{padding:10px;background:#fff;border-bottom:1px solid var(--line)}.callout{border-left:4px solid var(--blue);background:#eef5fd;border-radius:8px;padding:12px}.code{font-size:28px;font-weight:900;letter-spacing:4px;text-align:center;background:#102b46;color:#fff;border-radius:12px;padding:12px}.modal{position:fixed;inset:0;z-index:100;background:rgba(10,20,30,.5);display:flex;align-items:center;justify-content:center;padding:18px}.modal.hide{display:none}.modalbox{background:#fff;border-radius:18px;max-width:440px;width:100%;padding:20px}.status{font-size:12px;color:var(--muted)}.sendbox{margin-top:12px;padding:12px 14px;border-radius:12px;font-weight:800;display:none}.sendbox.wait{display:block;background:#fff7e8;color:#8a5700;border:1px solid #efd49f}.sendbox.ok{display:block;background:#eaf8f1;color:#12624e;border:1px solid #9ed8c4;font-size:17px}.sendbox.err{display:block;background:#fff0f0;color:#a52d2d;border:1px solid #efbcbc}@media(max-width:820px){.grid2,.grid3,.meta{grid-template-columns:1fr}.moves,.formations,.procs{grid-template-columns:repeat(2,1fr)}}@media(max-width:480px){.wrap{padding:10px 10px 60px}.moves,.formations,.procs{grid-template-columns:1fr}}

.pdf-stage{position:fixed;left:-100000px;top:0;width:794px;background:white;color:#17212b;font-family:Arial,Helvetica,sans-serif}
.pdf-page{width:794px;padding:34px 38px;background:white}
.pdf-title{font-size:25px;font-weight:800;border-bottom:3px solid #356da8;padding-bottom:8px;margin-bottom:12px}
.pdf-meta{width:100%;border-collapse:collapse;margin:8px 0 16px}.pdf-meta td{border:1px solid #cfd8e3;padding:6px 8px;font-size:12px}.pdf-meta td:first-child{font-weight:700;background:#f3f7fb;width:24%}
.pdf-sec{margin-top:16px}.pdf-sec h2{font-size:17px;background:#eaf2fb;padding:7px 9px;border-left:4px solid #356da8;margin:0 0 8px}.pdf-obs{border:1px solid #d7e0ea;border-radius:8px;padding:9px;margin:8px 0;font-size:12px;line-height:1.42}.pdf-obs b{color:#24486d}.pdf-par{border-left:4px solid #356da8;background:#f6f9fd;padding:11px;font-size:12px;line-height:1.5;white-space:pre-wrap}.pdf-note{font-size:11px;color:#5f6f7e}.pdf-row3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}.pdf-box{border:1px solid #d7e0ea;padding:8px;font-size:11px;white-space:pre-wrap}.pdf-check{font-size:11px;line-height:1.6}
</style><script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script></head><body><div class="wrap"><div id="app"></div></div><div id="modal" class="modal hide"><div class="modalbox"><h2>Code personnel</h2><p>Conserve ce code pour reprendre la fiche sur <b>ce même appareil et ce même navigateur</b>.</p><div id="mcode" class="code"></div><button class="btn primary big" style="margin-top:12px" onclick="closeModal()">Continuer</button></div></div><script>
const K='danse_spectateur_v1',A='ABCDEFGHJKLMNPQRSTUVWXYZ23456789';const REP=['mouvements / parties du corps','énergie / tonalité','relations entre danseurs','formations','procédés de composition','regard / intention','espace / directions / niveaux'];const TON=['légère','lourde','grande','petite','rapide','lente','contrôlée','relâchée','saccadée','continue'];const SPH=['près','loin du corps','haut','moyen','bas','avant','arrière','droite','gauche'];const FORM=['ligne','diagonale','cercle','carré','V','duo / trio','amas','espacé','face-à-face','autre'];const PROC=['répétition','accumulation','canon','unisson','contrepoint','contraste','transposition','portés','polyphonie','inversion','lâcher-rattraper','cascade'];const AUTO=['1 idée claire','au moins 1 exemple précis','vocabulaire de danse','effet expliqué','lien au thème / intention','connecteurs','aucune appréciation sans preuve'];let data=null,code='';
function db(){try{return JSON.parse(localStorage.getItem(K)||'{}')}catch(e){return {}}}function saveDb(d){localStorage.setItem(K,JSON.stringify(d))}function gen(){let d=db(),c='';do{c='';for(let i=0;i<8;i++)c+=A[Math.floor(Math.random()*A.length)]}while(d[c]);return c}function obs(){return{moment:'',faits:'',vocab:{rep:[],ton:[],sph:[],form:[],proc:[]},effet:''}}function blank(){return{meta:{spectacle:'',date:'',theme:'',duree:'',observateur:'',classe:'',titre:'',musique:'',prenom:'',nom:'',emailProf:''},observations:Array.from({length:4},obs),tri:{revient:'',marque:'',theme:''},prep:{intro:'',idee:'',preuve1:'',preuve2:'',effet:'',conclusion:''},paragraphe:'',auto:[]}}
function home(){app.innerHTML=`<h1>FICHE SPECTATEUR & PARAGRAPHE</h1><p class="small">HTML autonome — sauvegarde sur cet appareil.</p><div class="grid2"><div class="card"><h2>Nouvelle fiche</h2><p>Un code personnel sera créé à la première sauvegarde.</p><button class="btn primary big" onclick="newF()">Créer</button></div><div class="card"><h2>Reprendre une fiche</h2><label>Code personnel</label><input id="c" type="text" maxlength="8" style="text-transform:uppercase"><button class="btn big" style="margin-top:10px" onclick="resume()">Reprendre</button><div id="msg" class="small"></div></div></div>`}function newF(){data=blank();code='';render()}function resume(){let c=(document.getElementById('c').value||'').toUpperCase().replace(/[^A-Z0-9]/g,''),d=db();if(!d[c]){msg.textContent='Code introuvable sur cet appareil.';return}code=c;data=d[c];render()}function save(show=true){if(!code)code=gen();let d=db();d[code]=data;saveDb(d);st.textContent='Enregistré — code : '+code;if(show){mcode.textContent=code;modal.classList.remove('hide')}}function autosave(){if(code){let d=db();d[code]=data;saveDb(d);st.textContent='Enregistré automatiquement — '+code}}function closeModal(){modal.classList.add('hide')}
function render(){let m=data.meta;app.innerHTML=`<div class="header"><div class="row"><div><b>FICHE SPECTATEUR</b><div id="st" class="status">${code?'Code : '+code:'Pas encore enregistrée'}</div></div><div><button class="btn" onclick="home()">Accueil</button> <button class="btn primary" onclick="save()">Enregistrer</button></div></div></div><div id="ed"></div>`;let h=`<div class="card"><div class="meta">${fld('Spectacle / groupe','meta.spectacle',m.spectacle)}${datef('Date','meta.date',m.date)}${fld('Thème annoncé','meta.theme',m.theme)}${fld('Durée','meta.duree',m.duree)}${fld('Observateur','meta.observateur',m.observateur)}${fld('Classe','meta.classe',m.classe)}${fld('Titre','meta.titre',m.titre)}${fld('Musique','meta.musique',m.musique)}</div></div><div class="section"><h2>PRENDRE DES NOTES SUR UNE CHORÉGRAPHIE</h2></div><div class="callout"><b>Étape 1 : relever les éléments importants.</b><br>Je note d'abord ce qui est observable (faits précis), puis seulement l'effet et le sens. Éviter « c'est bien / nul / beau ».</div>`;data.observations.forEach((o,i)=>h+=oh(o,i));h+=`<button class="btn" onclick="addObs()">+ Ajouter une observation</button><div class="section"><h2>2. Trier ses notes</h2></div><div class="grid3"><div class="card">${area('CE QUI REVIENT','tri.revient',data.tri.revient)}</div><div class="card">${area('CE QUI MARQUE / CHANGE','tri.marque',data.tri.marque)}</div><div class="card">${area('CE QUI SERT LE THÈME','tri.theme',data.tri.theme)}</div></div><div class="section"><h2>CONSTRUIRE UN PARAGRAPHE CRITIQUE</h2></div><div class="callout"><b>Étape 2 : exploiter les notes, justifier et rédiger.</b><br>Un paragraphe critique formule une idée, s'appuie sur des éléments précis de la chorégraphie et explique l'effet ou le sens produit.</div><div class="method">${mr(1,'IDÉE / POINT DE VUE','Analyser le choix du chorégraphe par rapport au thème annoncé.','La chorégraphie rend progressivement l’idée d’enfermement plus forte.')}${mr(2,'PREUVE PRÉCISE','Citer un moment visible : mouvement, formation, procédé, tonalité, espace…','Au milieu, les danseurs resserrent le cercle et répètent le même geste en canon.')}${mr(3,'ANALYSE / EFFET','Expliquer ce que ce choix produit sur le spectateur.','Le décalage donne une impression de propagation et le resserrement augmente la tension.')}${mr(4,'LIEN AU THÈME / À L’INTENTION','Montrer pourquoi cet exemple est pertinent pour la chorégraphie.','Cela renforce l’idée d’une pression qui gagne tout le groupe.')}${mr(5,'BILAN / NUANCE','Conclure l’idée ou nuancer avec une limite précise.','Le choix est lisible ; cependant un passage peut manquer de lien avec le thème ou créer une rupture.')}</div><div class="section"><h2>Je prépare mes blocs</h2></div><div class="card">${area('Mon introduction','prep.intro',data.prep.intro)}${area('Mon idée principale','prep.idee',data.prep.idee)}${area('La preuve n°1 (moment précis)','prep.preuve1',data.prep.preuve1)}${area('La preuve n°2 éventuelle','prep.preuve2',data.prep.preuve2)}${area("L'effet / le sens produit",'prep.effet',data.prep.effet)}${area('La conclusion ou la nuance','prep.conclusion',data.prep.conclusion)}</div><div class="section"><h2>Connecteurs et phrases utiles</h2></div><div class="card small" style="font-size:13px;line-height:1.6"><b>Pour introduire :</b> Nous avons assisté à/au… / Nous sommes allés voir…<br><b>Pour présenter :</b> Nous montrerons que le chorégraphe… / Nous défendrons l'idée que…<br><b>Pour argumenter :</b> En effet, on observe que… / C'est pour cela que…<br><b>Pour prouver :</b> par exemple… / notamment… / au début… / lors de la transition…<br><b>Pour analyser :</b> Ce choix produit… / crée une impression de… / attire le regard vers…<br><b>Pour relier au thème :</b> Ainsi cela renforce… / symbolise… / traduit… / fait évoluer…<br><b>Pour nuancer :</b> cependant… / néanmoins… / la limite est… / ce choix serait plus lisible si…</div><div class="section"><h2>4. JE RÉDIGE MON PARAGRAPHE</h2></div><div class="card"><textarea style="min-height:260px" oninput="setp('paragraphe',this.value)">${esc(data.paragraphe||'')}</textarea><label>AUTO-CHECK</label>${pills(AUTO,data.auto,'auto')}</div><div class="section"><h2>Envoyer le résultat</h2></div><div class="card"><div class="grid2">${fld('Prénom','meta.prenom',m.prenom)}${fld('Nom','meta.nom',m.nom)}</div><p class="small">La fiche est transformée en <b>PDF</b>. L'élève n'a pas besoin d'adresse mail. Le mail reçu par le professeur contient uniquement la pièce jointe PDF ; son objet est « Nom Prénom - fiche observateur danse ». Pour l'envoi direct, cette page doit être ouverte depuis une adresse web (pas depuis un fichier local <code>file://</code>).</p><div class="grid2"><button id="sendBtn" class="btn ok big" onclick="sendDirect(this)">Envoyer la fiche PDF au professeur</button><button class="btn big" onclick="downloadPdf()">Télécharger ma fiche en PDF</button></div><div id="sendStatus" class="sendbox" aria-live="polite"></div></div>`;ed.innerHTML=h}
function oh(o,i){return `<details ${i===0?'open':''}><summary>Observation ${i+1}${o.moment?' — '+esc(o.moment).slice(0,55):''}</summary><div class="inner"><div class="grid2">${area('Moment — Quand ils / elles font…',`observations.${i}.moment`,o.moment)}${area('FAITS OBSERVABLES — je repère…',`observations.${i}.faits`,o.faits)}</div><div class="sub"><h4>Je repère</h4>${pills(REP,o.vocab.rep,`observations.${i}.vocab.rep`)}</div><div class="sub"><h4>Énergie / tonalité</h4>${pills(TON,o.vocab.ton,`observations.${i}.vocab.ton`)}</div><div class="sub"><h4>Espace / sphère</h4>${pills(SPH,o.vocab.sph,`observations.${i}.vocab.sph`)}</div><div class="sub"><h4>Formations</h4>${pills(FORM,o.vocab.form,`observations.${i}.vocab.form`)}</div><div class="sub"><h4>Procédés</h4>${pills(PROC,o.vocab.proc,`observations.${i}.vocab.proc`)}</div>${area('EFFET PRODUIT — ce que cela fait au spectateur',`observations.${i}.effet`,o.effet)}${data.observations.length>1?`<button class="btn danger" onclick="delObs(${i})">Supprimer cette observation</button>`:''}</div></details>`}function addObs(){data.observations.push(obs());render();autosave()}function delObs(i){if(confirm('Supprimer cette observation ?')){data.observations.splice(i,1);render();autosave()}}function mr(n,t,d,e){return `<div class="num">${n}</div><div class="txt"><b>${t}</b> — ${d}<br><i class="small">« ${e} »</i></div>`}
function fld(l,p,v){return `<div><label>${l}</label><input type="text" value="${attr(v||'')}" oninput="setp('${p}',this.value)"></div>`}function datef(l,p,v){return `<div><label>${l}</label><input type="date" value="${attr(v||'')}" oninput="setp('${p}',this.value)"></div>`}function area(l,p,v){return `<div><label>${l}</label><textarea oninput="setp('${p}',this.value)">${esc(v||'')}</textarea></div>`}function pills(a,s,p){s=s||[];return `<div class="pills">${a.map(v=>`<label class="pill"><input type="checkbox" ${s.includes(v)?'checked':''} onchange="tog('${p}',${JSON.stringify(v)},this.checked)"><span>${esc(v)}</span></label>`).join('')}</div>`}function setp(p,v){let a=p.split('.'),r=data;for(let i=0;i<a.length-1;i++)r=r[a[i]];r[a[a.length-1]]=v;autosave()}function getp(p){return p.split('.').reduce((r,k)=>r[k],data)}function tog(p,v,c){let a=getp(p),i=a.indexOf(v);if(c&&i<0)a.push(v);if(!c&&i>=0)a.splice(i,1);autosave()}
function report(){let m=data.meta,s=`FICHE SPECTATEUR — DANSE\nCode : ${code||'(non enregistré)'}\n\nÉlève : ${(m.prenom||'')} ${(m.nom||'')}\nObservateur : ${m.observateur||''}\nClasse : ${m.classe||''}\nSpectacle / groupe : ${m.spectacle||''}\nTitre : ${m.titre||''}\nThème : ${m.theme||''}\nMusique : ${m.musique||''}\n\nOBSERVATIONS\n`;data.observations.forEach((o,i)=>{s+=`\nObservation ${i+1}\nMoment : ${o.moment||''}\nFaits observables : ${o.faits||''}\nVocabulaire : ${Object.values(o.vocab).flat().join(', ')}\nEffet produit : ${o.effet||''}\n`});s+=`\nTRI DES NOTES\nCe qui revient : ${data.tri.revient||''}\nCe qui marque/change : ${data.tri.marque||''}\nCe qui sert le thème : ${data.tri.theme||''}\n\nPRÉPARATION\nIntroduction : ${data.prep.intro||''}\nIdée : ${data.prep.idee||''}\nPreuve 1 : ${data.prep.preuve1||''}\nPreuve 2 : ${data.prep.preuve2||''}\nEffet/sens : ${data.prep.effet||''}\nConclusion/nuance : ${data.prep.conclusion||''}\n\nPARAGRAPHE CRITIQUE\n${data.paragraphe||''}\n\nAUTO-CHECK : ${(data.auto||[]).join(' • ')}`;return s}function pdfEsc(v){return esc(v||'').replace(/\n/g,'<br>')}
function buildPdfReport(){
  const m=data.meta||{};
  const student=((m.prenom||'')+' '+(m.nom||'')).trim()||m.observateur||'';
  const obsHtml=(data.observations||[]).map((o,i)=>{
    const vocab=Object.values(o.vocab||{}).flat().filter(Boolean).join(', ');
    return `<div class="pdf-obs"><b>Observation ${i+1}</b><br><b>Moment :</b> ${pdfEsc(o.moment)}<br><b>Faits observables :</b> ${pdfEsc(o.faits)}<br><b>Outil / vocabulaire :</b> ${pdfEsc(vocab)}<br><b>Effet produit :</b> ${pdfEsc(o.effet)}</div>`;
  }).join('');
  const auto=(data.auto||[]).map(x=>'☑ '+esc(x)).join(' &nbsp; ');
  const div=document.createElement('div');
  div.className='pdf-stage';
  div.innerHTML=`<div class="pdf-page">
    <div class="pdf-title">FICHE SPECTATEUR — DANSE</div>
    <table class="pdf-meta">
      <tr><td>Élève / observateur</td><td>${esc(student)}</td><td>Classe</td><td>${esc(m.classe||'')}</td></tr>
      <tr><td>Spectacle / groupe</td><td>${esc(m.spectacle||'')}</td><td>Date</td><td>${esc(m.date||'')}</td></tr>
      <tr><td>Titre</td><td>${esc(m.titre||'')}</td><td>Durée</td><td>${esc(m.duree||'')}</td></tr>
      <tr><td>Thème annoncé</td><td>${esc(m.theme||'')}</td><td>Musique</td><td>${esc(m.musique||'')}</td></tr>
      <tr><td>Code de la fiche</td><td colspan="3">${esc(code||'')}</td></tr>
    </table>
    <div class="pdf-sec"><h2>1. Prendre des notes sur une chorégraphie</h2>${obsHtml||'<div class="pdf-note">Aucune observation.</div>'}</div>
    <div class="pdf-sec"><h2>2. Trier ses notes</h2><div class="pdf-row3"><div class="pdf-box"><b>CE QUI REVIENT</b><br>${pdfEsc(data.tri&&data.tri.revient)}</div><div class="pdf-box"><b>CE QUI MARQUE / CHANGE</b><br>${pdfEsc(data.tri&&data.tri.marque)}</div><div class="pdf-box"><b>CE QUI SERT LE THÈME</b><br>${pdfEsc(data.tri&&data.tri.theme)}</div></div></div>
    <div class="pdf-sec"><h2>3. Construire le paragraphe critique</h2>
      <div class="pdf-obs"><b>Introduction :</b> ${pdfEsc(data.prep&&data.prep.intro)}<br><b>Idée principale :</b> ${pdfEsc(data.prep&&data.prep.idee)}<br><b>Preuve n°1 :</b> ${pdfEsc(data.prep&&data.prep.preuve1)}<br><b>Preuve n°2 :</b> ${pdfEsc(data.prep&&data.prep.preuve2)}<br><b>Effet / sens :</b> ${pdfEsc(data.prep&&data.prep.effet)}<br><b>Conclusion / nuance :</b> ${pdfEsc(data.prep&&data.prep.conclusion)}</div>
    </div>
    <div class="pdf-sec"><h2>4. Paragraphe critique</h2><div class="pdf-par">${pdfEsc(data.paragraphe||'')}</div></div>
    <div class="pdf-sec"><h2>Auto-check</h2><div class="pdf-check">${auto||'Aucun élément coché.'}</div></div>
  </div>`;
  document.body.appendChild(div);
  return div;
}
async function makePdfBlob(){
  if(typeof html2pdf==='undefined') throw new Error("Le module PDF n'a pas pu être chargé. Vérifie la connexion Internet.");
  if(!code) save(false);
  const node=buildPdfReport();
  try{
    const worker=html2pdf().set({
      margin:0,
      filename:`fiche_spectateur_${code||'sans_code'}.pdf`,
      image:{type:'jpeg',quality:0.96},
      html2canvas:{scale:2,useCORS:true,backgroundColor:'#ffffff'},
      jsPDF:{unit:'pt',format:'a4',orientation:'portrait'},
      pagebreak:{mode:['css','legacy']}
    }).from(node).toPdf();
    const pdf=await worker.get('pdf');
    return pdf.output('blob');
  } finally { node.remove(); }
}
async function downloadPdf(){
  const status=document.getElementById('sendStatus');
  if(status){status.className='sendbox wait';status.textContent='Création du PDF…';}
  try{
    const blob=await makePdfBlob();

async function sendDirect(btn){
  const m=data.meta||{};
  if(!((m.prenom||m.observateur)&&m.classe)){
    alert('Renseigne au minimum le prénom / observateur et la classe.');
    return;
  }

  const status=document.getElementById('sendStatus');
  const oldText=btn.textContent;
  btn.disabled=true;
  btn.textContent='Création du PDF…';
  status.className='sendbox wait';
  status.textContent='Création du PDF…';

  try{
    save(false);
    const blob=await makePdfBlob();

    const identite=(`${m.nom||''} ${m.prenom||''}`).trim() || m.observateur || 'Élève';
    const safeName=identite.normalize('NFD')
      .replace(/[\u0300-\u036f]/g,'')
      .replace(/[^a-zA-Z0-9_-]+/g,'_')
      .replace(/^_+|_+$/g,'') || 'eleve';

    // Identifiant FormSubmit fourni après activation de l'adresse du professeur.
    // Il évite d'exposer l'adresse mail dans le HTML.
    const formKey=['60d35e','be69d2f1e9','a7b8710','378d23def'].join('');

    const form=document.createElement('form');
    form.method='POST';
    form.action='https://formsubmit.co/'+formKey;
    form.enctype='multipart/form-data';
    form.style.display='none';

    function hidden(name,value){
      const input=document.createElement('input');
      input.type='hidden';
      input.name=name;
      input.value=value;
      form.appendChild(input);
    }

    hidden('_subject',`${identite} - fiche observateur danse`);
    hidden('_captcha','false');
    hidden('_next','https://eps5555.github.io/Danse-EPS/spectateur.html?sent=1');

    // La fiche n'est PAS recopiée dans le corps du mail.
    // Seul le PDF est ajouté en pièce jointe.
    const fileInput=document.createElement('input');
    fileInput.type='file';
    fileInput.name='attachment';
    fileInput.accept='application/pdf';

    const dt=new DataTransfer();
    dt.items.add(new File(
      [blob],
      `${safeName}_fiche_observateur_danse.pdf`,
      {type:'application/pdf'}
    ));
    fileInput.files=dt.files;
    form.appendChild(fileInput);

    document.body.appendChild(form);

    btn.textContent='Envoi du PDF…';
    status.textContent='Envoi du PDF…';

    // Soumission native multipart/form-data :
    // c'est le mode prévu par FormSubmit pour une pièce jointe.
    form.submit();

  }catch(e){
    status.className='sendbox err';
    status.textContent='Envoi impossible : '+e.message;
    btn.disabled=false;
    btn.textContent=oldText;
  }
}

function showSentConfirmation(){
  const params=new URLSearchParams(window.location.search);
  if(params.get('sent')==='1'){

    const root=document.getElementById('app');
    root.prepend(box);
    history.replaceState({},document.title,window.location.pathname);
  }
}
