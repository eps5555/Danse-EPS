<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Fiche spectateur</title><style>
:root{--bg:#f4f7fb;--card:#fff;--ink:#17212b;--muted:#687684;--line:#d7e0ea;--blue:#356da8;--soft:#eaf2fb;--ok:#18765e;--danger:#b83232;--r:16px}*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:var(--bg);color:var(--ink)}.wrap{max-width:1100px;margin:auto;padding:14px 14px 80px}.header{position:sticky;top:0;z-index:20;background:rgba(244,247,251,.95);backdrop-filter:blur(8px);border-bottom:1px solid var(--line);padding:10px 0;margin-bottom:14px}.row{display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap}h1{font-size:clamp(26px,6vw,42px);margin:18px 0 6px}h2{font-size:21px;margin:0}.card{background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:16px;box-shadow:0 6px 22px rgba(20,40,70,.06)}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.meta{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.btn{border:0;border-radius:11px;padding:10px 14px;font-weight:700;background:#e5ebf2;color:#213249;cursor:pointer}.btn.primary{background:var(--blue);color:#fff}.btn.ok{background:var(--ok);color:#fff}.btn.danger{background:#fff0f0;color:var(--danger);border:1px solid #f1c9c9}.btn.big{width:100%;padding:14px;font-size:17px}label{font-weight:700;font-size:13px;display:block;margin:8px 0 5px}input[type=text],input[type=date],input[type=number],textarea{width:100%;border:1px solid #c7d2dd;border-radius:10px;padding:10px;background:#fff;color:var(--ink);font:inherit}textarea{min-height:78px;resize:vertical}.small{font-size:12px;color:var(--muted)}.section{margin:25px 0 10px;display:flex;justify-content:space-between;align-items:center;gap:10px}.pills{display:flex;flex-wrap:wrap;gap:7px}.pill{position:relative}.pill input{position:absolute;opacity:0}.pill span{display:inline-block;border:1px solid #cfd8e3;border-radius:999px;padding:7px 10px;background:#fff;font-size:13px}.pill input:checked+span{background:var(--soft);border-color:#79a4d0;color:#174b80;font-weight:700}details{background:#fff;border:1px solid var(--line);border-radius:14px;margin:10px 0;overflow:hidden}summary{cursor:pointer;font-weight:800;padding:13px 15px;background:#f9fbfd}.inner{padding:14px}.moves{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.move{border:1px solid var(--line);border-radius:12px;padding:8px;background:#fbfcfe}.n{font-weight:800;font-size:12px;color:var(--muted);margin-bottom:6px}canvas{display:block;width:100%;height:105px;background:#fff;border:1px dashed #aab8c5;border-radius:8px;touch-action:none}.mini{font-size:11px;padding:5px 8px;border:1px solid var(--line);background:#fff;border-radius:8px;cursor:pointer;margin-top:5px}.sub{padding-top:12px;margin-top:12px;border-top:1px solid #edf1f5}.sub h4{margin:0 0 7px}.formations,.procs{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.form,.proc{border:1px solid var(--line);border-radius:12px;padding:9px;background:#fff}.diag{white-space:pre;text-align:center;font-family:monospace;min-height:30px;color:#32485e}.formline{display:flex;align-items:center;gap:6px}.formline input[type=number]{width:58px;padding:5px}.proc b{display:block;margin-bottom:4px}.proc small{display:block;line-height:1.35;color:var(--muted)}.method{display:grid;grid-template-columns:42px 1fr;border:1px solid var(--line);border-radius:12px;overflow:hidden}.method .num{background:#4f79aa;color:#fff;font-weight:800;display:flex;align-items:center;justify-content:center;border-bottom:1px solid rgba(255,255,255,.25)}.method .txt{padding:10px;background:#fff;border-bottom:1px solid var(--line)}.callout{border-left:4px solid var(--blue);background:#eef5fd;border-radius:8px;padding:12px}.code{font-size:28px;font-weight:900;letter-spacing:4px;text-align:center;background:#102b46;color:#fff;border-radius:12px;padding:12px}.modal{position:fixed;inset:0;z-index:100;background:rgba(10,20,30,.5);display:flex;align-items:center;justify-content:center;padding:18px}.modal.hide{display:none}.modalbox{background:#fff;border-radius:18px;max-width:440px;width:100%;padding:20px}.status{font-size:12px;color:var(--muted)}.sendbox{margin-top:12px;padding:12px 14px;border-radius:12px;font-weight:800;display:none}.sendbox.wait{display:block;background:#fff7e8;color:#8a5700;border:1px solid #efd49f}.sendbox.ok{display:block;background:#eaf8f1;color:#12624e;border:1px solid #9ed8c4;font-size:17px}.sendbox.err{display:block;background:#fff0f0;color:#a52d2d;border:1px solid #efbcbc}@media(max-width:820px){.grid2,.grid3,.meta{grid-template-columns:1fr}.moves,.formations,.procs{grid-template-columns:repeat(2,1fr)}}@media(max-width:480px){.wrap{padding:10px 10px 60px}.moves,.formations,.procs{grid-template-columns:1fr}}

.pdf-stage{position:absolute;left:0;top:0;width:794px;z-index:-9999;pointer-events:none;background:white;color:#17212b;font-family:Arial,Helvetica,sans-serif}

.pdf-connect{border:1px solid #9eacba;padding:7px 9px;font-size:9px;line-height:1.45;margin-top:8px}

</style><script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script></head><body><div class="wrap"><div id="app"></div></div><div id="modal" class="modal hide"><div class="modalbox"><h2>Code personnel</h2><p>Conserve ce code pour reprendre la fiche sur <b>ce même appareil et ce même navigateur</b>.</p><div id="mcode" class="code"></div><button class="btn primary big" style="margin-top:12px" onclick="closeModal()">Continuer</button></div></div><script>
const K='danse_spectateur_v1',A='ABCDEFGHJKLMNPQRSTUVWXYZ23456789';const REP=['mouvements / parties du corps','énergie / tonalité','relations entre danseurs','formations','procédés de composition','regard / intention','espace / directions / niveaux'];const TON=['légère','lourde','grande','petite','rapide','lente','contrôlée','relâchée','saccadée','continue'];const SPH=['près','loin du corps','haut','moyen','bas','avant','arrière','droite','gauche'];const FORM=['ligne','diagonale','cercle','carré','V','duo / trio','amas','espacé','face-à-face','autre'];const PROC=['répétition','accumulation','canon','unisson','contrepoint','contraste','transposition','portés','polyphonie','inversion','lâcher-rattraper','cascade'];const AUTO=['1 idée claire','au moins 1 exemple précis','vocabulaire de danse','effet expliqué','lien au thème / intention','connecteurs','aucune appréciation sans preuve'];let data=null,code='';
function db(){try{return JSON.parse(localStorage.getItem(K)||'{}')}catch(e){return {}}}function saveDb(d){localStorage.setItem(K,JSON.stringify(d))}function gen(){let d=db(),c='';do{c='';for(let i=0;i<8;i++)c+=A[Math.floor(Math.random()*A.length)]}while(d[c]);return c}function obs(){return{moment:'',faits:'',vocab:{rep:[],ton:[],sph:[],form:[],proc:[]},effet:'',sens:''}}function blank(){return{meta:{spectacle:'',date:'',theme:'',duree:'',observateur:'',classe:'',titre:'',musique:'',prenom:'',nom:'',emailProf:''},observations:Array.from({length:4},obs),tri:{revient:'',marque:'',theme:''},prep:{intro:'',idee:'',preuve1:'',preuve2:'',effet:'',conclusion:''},paragraphe:'',auto:[]}}
function home(){app.innerHTML=`<h1>FICHE SPECTATEUR & PARAGRAPHE</h1><p class="small">HTML autonome — sauvegarde sur cet appareil.</p><div class="grid2"><div class="card"><h2>Nouvelle fiche</h2><p>Un code personnel sera créé à la première sauvegarde.</p><button class="btn primary big" onclick="newF()">Créer</button></div><div class="card"><h2>Reprendre une fiche</h2><label>Code personnel</label><input id="c" type="text" maxlength="8" style="text-transform:uppercase"><button class="btn big" style="margin-top:10px" onclick="resume()">Reprendre</button><div id="msg" class="small"></div></div></div>`}function newF(){data=blank();code='';render()}function resume(){let c=(document.getElementById('c').value||'').toUpperCase().replace(/[^A-Z0-9]/g,''),d=db();if(!d[c]){msg.textContent='Code introuvable sur cet appareil.';return}code=c;data=d[c];render()}function save(show=true){if(!code)code=gen();let d=db();d[code]=data;saveDb(d);st.textContent='Enregistré — code : '+code;if(show){mcode.textContent=code;modal.classList.remove('hide')}}function autosave(){if(code){let d=db();d[code]=data;saveDb(d);st.textContent='Enregistré automatiquement — '+code}}function closeModal(){modal.classList.add('hide')}
function render(){let m=data.meta;app.innerHTML=`<div class="header"><div class="row"><div><b>FICHE SPECTATEUR</b><div id="st" class="status">${code?'Code : '+code:'Pas encore enregistrée'}</div></div><div><button class="btn" onclick="home()">Accueil</button> <button class="btn primary" onclick="save()">Enregistrer</button></div></div></div><div id="ed"></div>`;let h=`<div class="card"><div class="meta">${fld('Spectacle / groupe','meta.spectacle',m.spectacle)}${datef('Date','meta.date',m.date)}${fld('Thème annoncé','meta.theme',m.theme)}${fld('Durée','meta.duree',m.duree)}${fld('Observateur','meta.observateur',m.observateur)}${fld('Classe','meta.classe',m.classe)}${fld('Titre','meta.titre',m.titre)}${fld('Musique','meta.musique',m.musique)}</div></div><div class="section"><h2>PRENDRE DES NOTES SUR UNE CHORÉGRAPHIE</h2></div><div class="callout"><b>Étape 1 : relever les éléments importants.</b><br>Je note d'abord ce qui est observable (faits précis), puis seulement l'effet et le sens. Éviter « c'est bien / nul / beau ».</div>`;data.observations.forEach((o,i)=>h+=oh(o,i));h+=`<button class="btn" onclick="addObs()">+ Ajouter une observation</button><div class="section"><h2>2. Trier ses notes</h2></div><div class="grid3"><div class="card">${area('CE QUI REVIENT','tri.revient',data.tri.revient)}</div><div class="card">${area('CE QUI MARQUE / CHANGE','tri.marque',data.tri.marque)}</div><div class="card">${area('CE QUI SERT LE THÈME','tri.theme',data.tri.theme)}</div></div><div class="section"><h2>CONSTRUIRE UN PARAGRAPHE CRITIQUE</h2></div><div class="callout"><b>Étape 2 : exploiter les notes, justifier et rédiger.</b><br>Un paragraphe critique formule une idée, s'appuie sur des éléments précis de la chorégraphie et explique l'effet ou le sens produit.</div><div class="method">${mr(1,'IDÉE / POINT DE VUE','Analyser le choix du chorégraphe par rapport au thème annoncé.','La chorégraphie rend progressivement l’idée d’enfermement plus forte.')}${mr(2,'PREUVE PRÉCISE','Citer un moment visible : mouvement, formation, procédé, tonalité, espace…','Au milieu, les danseurs resserrent le cercle et répètent le même geste en canon.')}${mr(3,'ANALYSE / EFFET','Expliquer ce que ce choix produit sur le spectateur.','Le décalage donne une impression de propagation et le resserrement augmente la tension.')}${mr(4,'LIEN AU THÈME / À L’INTENTION','Montrer pourquoi cet exemple est pertinent pour la chorégraphie.','Cela renforce l’idée d’une pression qui gagne tout le groupe.')}${mr(5,'BILAN / NUANCE','Conclure l’idée ou nuancer avec une limite précise.','Le choix est lisible ; cependant un passage peut manquer de lien avec le thème ou créer une rupture.')}</div><div class="section"><h2>Je prépare mes blocs</h2></div><div class="card">${area('Mon introduction','prep.intro',data.prep.intro)}${area('Mon idée principale','prep.idee',data.prep.idee)}${area('La preuve n°1 (moment précis)','prep.preuve1',data.prep.preuve1)}${area('La preuve n°2 éventuelle','prep.preuve2',data.prep.preuve2)}${area("L'effet / le sens produit",'prep.effet',data.prep.effet)}${area('La conclusion ou la nuance','prep.conclusion',data.prep.conclusion)}</div><div class="section"><h2>Connecteurs et phrases utiles</h2></div><div class="card small" style="font-size:13px;line-height:1.6"><b>Pour introduire :</b> Nous avons assisté à/au… / Nous sommes allés voir…<br><b>Pour présenter :</b> Nous montrerons que le chorégraphe… / Nous défendrons l'idée que…<br><b>Pour argumenter :</b> En effet, on observe que… / C'est pour cela que…<br><b>Pour prouver :</b> par exemple… / notamment… / au début… / lors de la transition…<br><b>Pour analyser :</b> Ce choix produit… / crée une impression de… / attire le regard vers…<br><b>Pour relier au thème :</b> Ainsi cela renforce… / symbolise… / traduit… / fait évoluer…<br><b>Pour nuancer :</b> cependant… / néanmoins… / la limite est… / ce choix serait plus lisible si…</div><div class="section"><h2>4. JE RÉDIGE MON PARAGRAPHE</h2></div><div class="card"><textarea style="min-height:260px" oninput="setp('paragraphe',this.value)">${esc(data.paragraphe||'')}</textarea><label>AUTO-CHECK</label>${pills(AUTO,data.auto,'auto')}</div><div class="section"><h2>Télécharger le résultat</h2></div><div class="card"><div class="grid2">${fld('Prénom','meta.prenom',m.prenom)}${fld('Nom','meta.nom',m.nom)}</div><p class="small">La fiche est transformée en <b>PDF</b> et téléchargée directement sur l'appareil. Ensuite, dépose ce fichier dans le <b>casier numérique Pronote</b> demandé par le professeur.</p><button class="btn ok big" onclick="downloadPdf()">Télécharger ma fiche en PDF</button><div id="sendStatus" class="sendbox" aria-live="polite"></div></div>`;ed.innerHTML=h}
function oh(o,i){return `<details ${i===0?'open':''}><summary>Observation ${i+1}${o.moment?' — '+esc(o.moment).slice(0,55):''}</summary><div class="inner"><div class="grid2">${area('Moment — Quand ils / elles font…',`observations.${i}.moment`,o.moment)}${area('FAITS OBSERVABLES — je repère…',`observations.${i}.faits`,o.faits)}</div><div class="sub"><h4>Je repère</h4>${pills(REP,o.vocab.rep,`observations.${i}.vocab.rep`)}</div><div class="sub"><h4>Énergie / tonalité</h4>${pills(TON,o.vocab.ton,`observations.${i}.vocab.ton`)}</div><div class="sub"><h4>Espace / sphère</h4>${pills(SPH,o.vocab.sph,`observations.${i}.vocab.sph`)}</div><div class="sub"><h4>Formations</h4>${pills(FORM,o.vocab.form,`observations.${i}.vocab.form`)}</div><div class="sub"><h4>Procédés</h4>${pills(PROC,o.vocab.proc,`observations.${i}.vocab.proc`)}</div>${area('EFFET PRODUIT — ce que cela fait au spectateur',`observations.${i}.effet`,o.effet)}${area('SENS / THÈME — ce que cela peut signifier',`observations.${i}.sens`,o.sens||'')}${data.observations.length>1?`<button class="btn danger" onclick="delObs(${i})">Supprimer cette observation</button>`:''}</div></details>`}function addObs(){data.observations.push(obs());render();autosave()}function delObs(i){if(confirm('Supprimer cette observation ?')){data.observations.splice(i,1);render();autosave()}}function mr(n,t,d,e){return `<div class="num">${n}</div><div class="txt"><b>${t}</b> — ${d}<br><i class="small">« ${e} »</i></div>`}
function fld(l,p,v){return `<div><label>${l}</label><input type="text" value="${attr(v||'')}" oninput="setp('${p}',this.value)"></div>`}function datef(l,p,v){return `<div><label>${l}</label><input type="date" value="${attr(v||'')}" oninput="setp('${p}',this.value)"></div>`}function area(l,p,v){return `<div><label>${l}</label><textarea oninput="setp('${p}',this.value)">${esc(v||'')}</textarea></div>`}function pills(a,s,p){s=s||[];return `<div class="pills">${a.map(v=>`<label class="pill"><input type="checkbox" ${s.includes(v)?'checked':''} onchange="tog('${p}',${JSON.stringify(v)},this.checked)"><span>${esc(v)}</span></label>`).join('')}</div>`}function setp(p,v){let a=p.split('.'),r=data;for(let i=0;i<a.length-1;i++)r=r[a[i]];r[a[a.length-1]]=v;autosave()}function getp(p){return p.split('.').reduce((r,k)=>r[k],data)}function tog(p,v,c){let a=getp(p),i=a.indexOf(v);if(c&&i<0)a.push(v);if(!c&&i>=0)a.splice(i,1);autosave()}
function report(){let m=data.meta,s=`FICHE SPECTATEUR — DANSE\nCode : ${code||'(non enregistré)'}\n\nÉlève : ${(m.prenom||'')} ${(m.nom||'')}\nObservateur : ${m.observateur||''}\nClasse : ${m.classe||''}\nSpectacle / groupe : ${m.spectacle||''}\nTitre : ${m.titre||''}\nThème : ${m.theme||''}\nMusique : ${m.musique||''}\n\nOBSERVATIONS\n`;data.observations.forEach((o,i)=>{s+=`\nObservation ${i+1}\nMoment : ${o.moment||''}\nFaits observables : ${o.faits||''}\nVocabulaire : ${Object.values(o.vocab).flat().join(', ')}\nEffet produit : ${o.effet||''}\n`});s+=`\nTRI DES NOTES\nCe qui revient : ${data.tri.revient||''}\nCe qui marque/change : ${data.tri.marque||''}\nCe qui sert le thème : ${data.tri.theme||''}\n\nPRÉPARATION\nIntroduction : ${data.prep.intro||''}\nIdée : ${data.prep.idee||''}\nPreuve 1 : ${data.prep.preuve1||''}\nPreuve 2 : ${data.prep.preuve2||''}\nEffet/sens : ${data.prep.effet||''}\nConclusion/nuance : ${data.prep.conclusion||''}\n\nPARAGRAPHE CRITIQUE\n${data.paragraphe||''}\n\nAUTO-CHECK : ${(data.auto||[]).join(' • ')}`;return s}function pdfEsc(v){return esc(v||'').replace(/\n/g,'<br>')}
function buildPdfReport(){
  const m=data.meta||{};
  const student=((m.prenom||'')+' '+(m.nom||'')).trim()||m.observateur||'';
  const observations=(data.observations||[]).slice(0,6);

  while(observations.length<6){
    observations.push({moment:'',faits:'',vocab:{},effet:'',sens:''});
  }

  const obsRows=observations.map(o=>{
    const vocab=Object.values(o.vocab||{}).flat().filter(Boolean).join(', ');
    return `<tr>
      <td>${pdfEsc(o.moment||'')}</td>
      <td>${pdfEsc(o.faits||'')}</td>
      <td>${pdfEsc(vocab)}</td>
      <td>${pdfEsc(o.effet||'')}</td>
      <td>${pdfEsc(o.sens||'')}</td>
    </tr>`;
  }).join('');

  const autoSelected=new Set(data.auto||[]);
  const autoHtml=AUTO.map(x=>`${autoSelected.has(x)?'☑':'☐'} ${esc(x)}`).join(' &nbsp; ');

  const bestNotes=[
    (data.tri&&data.tri.marque)||'',
    (data.tri&&data.tri.theme)||''
  ].filter(Boolean).join(' • ');

  const div=document.createElement('div');
  div.className='pdf-stage';

  div.innerHTML=`
  <div class="pdf-page">
    <div class="pdf-title">FICHE D’APPRENTISSAGE — PRENDRE DES NOTES SUR UNE CHORÉGRAPHIE</div>
    <div class="pdf-subtitle">Étape 1 : observer précisément avant de juger</div>

    <table class="pdf-meta">
      <tr>
        <td class="lab">Spectacle / groupe</td><td>${esc(m.spectacle||'')}</td>
        <td class="lab">Date</td><td>${esc(m.date||'')}</td>
      </tr>
      <tr>

  <div class="pdf-page">

  document.body.appendChild(div);

}
async function makePdfBlob(){
  if(!window.jspdf || !window.jspdf.jsPDF){
    throw new Error("Le module PDF n'a pas pu être chargé. Vérifie la connexion Internet.");
  }
  if(!code) save(false);

  const {jsPDF}=window.jspdf;
  const doc=new jsPDF({orientation:'portrait',unit:'mm',format:'a4',compress:true});
  const m=data.meta||{};
  const student=((m.prenom||'')+' '+(m.nom||'')).trim()||m.observateur||'';
  const pageW=210, margin=10, innerW=190;

  function txt(v){return String(v??'').replace(/\s+/g,' ').trim();}
  function setFont(size=9,bold=false){
    doc.setFont('helvetica',bold?'bold':'normal');
    doc.setFontSize(size);
    doc.setTextColor(23,33,43);
  }
  function fitLines(text,width,maxLines){
    setFont(doc.getFontSize?doc.getFontSize():9,false);
    let lines=doc.splitTextToSize(txt(text),Math.max(2,width));
    if(!Array.isArray(lines)) lines=[String(lines||'')];
    if(lines.length>maxLines){
      lines=lines.slice(0,maxLines);
      let last=lines[maxLines-1]||'';
      if(last.length>3) last=last.slice(0,Math.max(1,last.length-3))+'...';
      lines[maxLines-1]=last;
    }
    return lines;
  }
  function cell(x,y,w,h,label,value,labelW=0,fillLabel=true){
    doc.setDrawColor(143,158,172);
    doc.setLineWidth(.25);
    doc.rect(x,y,w,h);
    if(labelW>0){
      if(fillLabel){
        doc.setFillColor(241,245,249);
        doc.rect(x,y,labelW,h,'F');
        doc.rect(x,y,labelW,h);
      }
      setFont(7.5,true);
      const ll=doc.splitTextToSize(label,labelW-3);
      doc.text(ll,x+1.5,y+3.4);
      setFont(8,false);
      const lines=fitLines(value,w-labelW-3,Math.max(1,Math.floor((h-2)/3.7)));
      doc.text(lines,x+labelW+1.5,y+3.5);
    }else{
      setFont(8,false);
      const lines=fitLines(value,w-3,Math.max(1,Math.floor((h-2)/3.7)));
      doc.text(lines,x+1.5,y+3.5);
    }
  }
  function headerTitle(title,subtitle){
    setFont(13,true);
    doc.text(title,pageW/2,12,{align:'center'});
    setFont(8.3,false);
    doc.setTextColor(78,96,112);
    doc.text(subtitle,pageW/2,18,{align:'center'});
    doc.setTextColor(23,33,43);
  }
  function sectionTitle(text,y){
    doc.setFillColor(237,244,251);
    doc.rect(margin,y,innerW,7,'F');
    doc.setFillColor(53,109,168);
    doc.rect(margin,y,1.5,7,'F');
    setFont(9.5,true);
    doc.text(text,margin+3,y+4.8);
  }
  function box(x,y,w,h,title,value,fontSize=7.6){
    doc.setDrawColor(143,158,172);
    doc.rect(x,y,w,h);
    setFont(7.5,true);
    doc.text(title,x+2,y+4);
    setFont(fontSize,false);
    const lines=doc.splitTextToSize(txt(value),w-4);
    const max=Math.max(1,Math.floor((h-7)/3.7));
    let shown=lines.slice(0,max);
    if(lines.length>max && shown.length){
      let last=shown[shown.length-1];
      shown[shown.length-1]=(last.length>3?last.slice(0,-3):last)+'...';
    }
    doc.text(shown,x+2,y+8);
  }
  function drawWrappedBox(x,y,w,h,title,value){
    doc.setDrawColor(143,158,172);
    doc.rect(x,y,w,h);
    if(title){
      setFont(8,true);
      doc.text(title,x+2,y+4.2);
    }
    setFont(8,false);
    const top=title?8:4;
    const lines=doc.splitTextToSize(String(value||''),w-4);
    const max=Math.max(1,Math.floor((h-top-2)/4));
    const first=lines.slice(0,max);
    const rest=lines.slice(max);
    doc.text(first,x+2,y+top);
    return rest;
  }

  // PAGE 1 — fiche d'observation
  headerTitle("FICHE D'APPRENTISSAGE - PRENDRE DES NOTES SUR UNE CHOREGRAPHIE","Etape 1 : observer precisement avant de juger");

  const metaY=22, rowH=7, half=95;
  cell(margin,metaY,half,rowH,'Spectacle / groupe',m.spectacle||'',28);
  cell(margin+half,metaY,half,rowH,'Date',m.date||'',18);
  cell(margin,metaY+rowH,half,rowH,'Theme annonce',m.theme||'',28);
  cell(margin+half,metaY+rowH,half,rowH,'Duree',m.duree||'',18);
  cell(margin,metaY+rowH*2,half,rowH,'Observateur',student,28);
  cell(margin+half,metaY+rowH*2,half,rowH,'Classe',m.classe||'',18);
  cell(margin,metaY+rowH*3,half,rowH,'Titre',m.titre||'',28);
  cell(margin+half,metaY+rowH*3,half,rowH,'Musique',m.musique||'',18);

  box(margin,52,innerW,13,'REGLE',"Je note d'abord des faits observables, puis j'explique l'effet produit et le sens possible. J'evite les appreciations sans preuve.",7.2);
  box(margin,68,innerW,16,'CE QUE JE PEUX OBSERVER',"Mouvements / parties du corps - espace / directions / niveaux - temps / rythme - energie / tonalite - relations entre danseurs - formations - procedes de composition - transitions - musique / silence - regard / intention.",6.8);

  const tableY=88;
  const cols=[23,51,44,36,36];
  const heads=['MOMENT / REPERE','FAITS OBSERVABLES','OUTIL / VOCABULAIRE','EFFET PRODUIT','SENS / THEME'];
  let x=margin;
  doc.setFillColor(234,242,251);
  doc.setDrawColor(143,158,172);
  for(let i=0;i<cols.length;i++){
    doc.rect(x,tableY,cols[i],11,'FD');
    setFont(6.8,true);
    const hLines=doc.splitTextToSize(heads[i],cols[i]-3);
    doc.text(hLines,x+1.5,tableY+4);
    x+=cols[i];
  }

  const observations=(data.observations||[]).slice(0,6);
  while(observations.length<6) observations.push({moment:'',faits:'',vocab:{},effet:'',sens:''});
  const rowHeight=20;
  observations.forEach((o,r)=>{
    const values=[
      o.moment||'',
      o.faits||'',
      Object.values(o.vocab||{}).flat().filter(Boolean).join(', '),
      o.effet||'',
      o.sens||''
    ];
    let xx=margin;
    values.forEach((v,i)=>{
      doc.rect(xx,tableY+11+r*rowHeight,cols[i],rowHeight);
      setFont(6.7,false);
      const lines=doc.splitTextToSize(txt(v),cols[i]-3);
      const max=5;
      let shown=lines.slice(0,max);
      if(lines.length>max && shown.length){
        let last=shown[shown.length-1];
        shown[shown.length-1]=(last.length>3?last.slice(0,-3):last)+'...';
      }
      doc.text(shown,xx+1.5,tableY+15+r*rowHeight);
      xx+=cols[i];
    });
  });

  sectionTitle('2. TRIER SES NOTES',222);
  const bw=(innerW-6)/3;
  box(margin,231,bw,31,'CE QUI REVIENT',data.tri&&data.tri.revient||'',7.1);
  box(margin+bw+3,231,bw,31,'CE QUI MARQUE / CHANGE',data.tri&&data.tri.marque||'',7.1);
  box(margin+(bw+3)*2,231,bw,31,'CE QUI SERT LE THEME',data.tri&&data.tri.theme||'',7.1);
  box(margin,265,innerW,18,'MES 2 NOTES LES PLUS UTILES POUR ECRIRE',
      [data.tri&&data.tri.marque||'',data.tri&&data.tri.theme||''].filter(Boolean).join(' - '),7.2);

  // PAGE 2 — méthode + rédaction
  doc.addPage();
  headerTitle("FICHE METHODO - CONSTRUIRE UN PARAGRAPHE CRITIQUE","Etape 2 : exploiter les notes, justifier et rediger");
  box(margin,23,innerW,15,'OBJECTIF',"Un paragraphe critique formule une idee, s'appuie sur un element precis de la choregraphie et explique l'effet ou le sens produit.",7.4);

  const flowY=43, gap=3, flowW=(innerW-gap*4)/5;
  ['IDEE','PREUVE','ANALYSE','SENS','BILAN'].forEach((t,i)=>{
    const xx=margin+i*(flowW+gap);
    doc.setDrawColor(143,158,172);
    doc.setFillColor(248,250,252);
    doc.rect(xx,flowY,flowW,11,'FD');
    setFont(8,true);
    doc.text(t,xx+flowW/2,flowY+7,{align:'center'});
  });

  const steps=[
    ['1','IDEE / POINT DE VUE',"Formuler ce que l'on veut montrer sur les choix du choregraphe et leur relation au theme."],
    ['2','PREUVE PRECISE',"Citer un moment visible : mouvement, formation, procede, tonalite, espace, relation entre danseurs..."],
    ['3','ANALYSE / EFFET',"Expliquer ce que ce choix produit sur le spectateur."],
    ['4','LIEN AU THEME / INTENTION',"Montrer pourquoi l'exemple choisi est pertinent pour la choregraphie."],
    ['5','BILAN / NUANCE',"Conclure l'idee ou la nuancer avec une limite precise."]
  ];
  let sy=58;
  steps.forEach(s=>{
    doc.setDrawColor(143,158,172);
    doc.setFillColor(79,121,170);
    doc.rect(margin,sy,9,11,'F');
    doc.rect(margin,sy,innerW,11);
    setFont(9,true); doc.setTextColor(255,255,255); doc.text(s[0],margin+4.5,sy+7,{align:'center'});
    doc.setTextColor(23,33,43);
    doc.setFillColor(241,245,249); doc.rect(margin+9,sy,43,11,'F'); doc.rect(margin+9,sy,43,11);
    setFont(6.8,true); doc.text(doc.splitTextToSize(s[1],39),margin+11,sy+4);
    setFont(6.8,false); doc.text(doc.splitTextToSize(s[2],innerW-57),margin+55,sy+4);
    sy+=11;
  });

  sectionTitle('JE PREPARE MON PARAGRAPHE',116);
  const prep=[
    ['Mon introduction',data.prep&&data.prep.intro||''],
    ['Mon idee principale',data.prep&&data.prep.idee||''],
    ['La preuve n°1',data.prep&&data.prep.preuve1||''],
    ['La preuve n°2 eventuelle',data.prep&&data.prep.preuve2||''],
    ["L'effet / le sens produit",data.prep&&data.prep.effet||''],
    ['La conclusion ou la nuance',data.prep&&data.prep.conclusion||'']
  ];
  let py=125;
  prep.forEach(p=>{
    doc.setDrawColor(143,158,172);
    doc.setFillColor(241,245,249);
    doc.rect(margin,py,48,12,'F');
    doc.rect(margin,py,innerW,12);
    doc.rect(margin,py,48,12);
    setFont(7.1,true); doc.text(doc.splitTextToSize(p[0],44),margin+2,py+4);
    setFont(7.1,false);
    let lines=doc.splitTextToSize(txt(p[1]),innerW-53).slice(0,2);
    doc.text(lines,margin+51,py+4);
    py+=12;
  });

  box(margin,200,innerW,19,'CONNECTEURS ET PHRASES UTILES',
      "Presenter : Nous montrerons que... / Prouver : Par exemple... / Analyser : Ce choix produit... / Relier au theme : Cela renforce... / Nuancer : Cependant... / Neanmoins...",6.8);

  sectionTitle('4. JE REDIGE MON PARAGRAPHE',222);
  const paraText=String(data.paragraphe||'');
  const paraLines=doc.splitTextToSize(paraText,innerW-4);
  const maxPage2=13;
  doc.setDrawColor(143,158,172);
  doc.rect(margin,231,innerW,52);
  setFont(8,false);
  doc.text(paraLines.slice(0,maxPage2),margin+2,236);

  const auto=(data.auto||[]);
  if(auto.length){
    setFont(6.8,false);
    const autoText='AUTO-CHECK : '+AUTO.map(x=>(auto.includes(x)?'[x] ':'[ ] ')+x).join('   ');
    doc.text(doc.splitTextToSize(autoText,innerW),margin,290);
  }

  // Si le paragraphe est plus long que la zone papier, on ajoute une page de continuation
  // afin de ne jamais perdre ce que l'eleve a ecrit.
  if(paraLines.length>maxPage2){
    doc.addPage();
    headerTitle('PARAGRAPHE CRITIQUE - SUITE','Texte complet de la fiche spectateur');
    doc.setDrawColor(143,158,172);
    doc.rect(margin,25,innerW,252);
    setFont(9,false);
    const rest=paraLines.slice(maxPage2);
    doc.text(rest,margin+3,31,{maxWidth:innerW-6,lineHeightFactor:1.35});
  }

  return doc.output('blob');
}
async function downloadPdf(){
  const status=document.getElementById('sendStatus');
  if(status){status.className='sendbox wait';status.textContent='Création du PDF…';}
  try{
    const blob=await makePdfBlob();
    const a=document.createElement('a');a.href=URL.createObjectURL(blob);const m=data.meta||{};const identite=(`${m.nom||''} ${m.prenom||''}`).trim()||m.observateur||'eleve';const safeName=identite.normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-zA-Z0-9_-]+/g,'_').replace(/^_+|_+$/g,'')||'eleve';a.download=`${safeName}_fiche_observateur_danse.pdf`;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1500);
    if(status){status.className='sendbox ok';status.textContent='✓ PDF CRÉÉ';}
  }catch(e){if(status){status.className='sendbox err';status.textContent='Création du PDF impossible : '+e.message;}}
}
function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function attr(v){return esc(v).replace(/`/g,'&#96;')}home();
