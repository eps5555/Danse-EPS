<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Fiche spectateur danse</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
<style>
:root{--bg:#f4f7fb;--card:#fff;--ink:#17212b;--muted:#687684;--line:#d7e0ea;--blue:#356da8;--soft:#eaf2fb;--ok:#18765e;--danger:#b83232}
*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:var(--bg);color:var(--ink)}
.wrap{max-width:1000px;margin:auto;padding:14px 14px 70px}.top{position:sticky;top:0;background:rgba(244,247,251,.96);backdrop-filter:blur(8px);border-bottom:1px solid var(--line);padding:10px 0;z-index:20}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}.card{background:#fff;border:1px solid var(--line);border-radius:16px;padding:16px;margin:12px 0;box-shadow:0 6px 20px rgba(20,40,70,.06)}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
label{display:block;font-weight:700;font-size:13px;margin:7px 0 5px}input,textarea{width:100%;border:1px solid #c7d2dd;border-radius:10px;padding:10px;font:inherit;background:#fff}textarea{min-height:82px;resize:vertical}
button{border:0;border-radius:11px;padding:10px 14px;font-weight:700;cursor:pointer;background:#e5ebf2}.primary{background:var(--blue);color:#fff}.ok{background:var(--ok);color:#fff}.big{width:100%;padding:14px;font-size:17px}
.small{font-size:12px;color:var(--muted)}h1{font-size:clamp(26px,6vw,42px);margin:18px 0 6px}h2{font-size:21px}.pillbox{display:flex;flex-wrap:wrap;gap:7px}.pill{position:relative}.pill input{position:absolute;opacity:0}.pill span{display:inline-block;border:1px solid #cfd8e3;border-radius:999px;padding:7px 10px;background:white;font-size:13px}.pill input:checked+span{background:var(--soft);border-color:#79a4d0;color:#174b80;font-weight:700}
details{background:#fff;border:1px solid var(--line);border-radius:14px;margin:10px 0;overflow:hidden}summary{padding:13px 15px;font-weight:800;background:#f9fbfd;cursor:pointer}.inner{padding:14px}.callout{border-left:4px solid var(--blue);background:#eef5fd;padding:12px;border-radius:8px}.method{display:grid;grid-template-columns:42px 1fr;border:1px solid var(--line);border-radius:12px;overflow:hidden}.num{background:#4f79aa;color:#fff;font-weight:800;display:flex;align-items:center;justify-content:center}.txt{padding:10px;background:#fff;border-bottom:1px solid var(--line)}
.status{font-size:12px;color:var(--muted)}.msg{display:none;margin-top:10px;padding:12px;border-radius:10px;font-weight:800}.msg.wait{display:block;background:#fff7e8;color:#8a5700}.msg.ok{display:block;background:#eaf8f1;color:#12624e}.msg.err{display:block;background:#fff0f0;color:#a52d2d}
.pdfstage{position:fixed;left:-100000px;top:0;width:794px;background:#fff;color:#17212b}.pdfpage{padding:32px 36px}.pdftitle{font-size:24px;font-weight:800;border-bottom:3px solid #356da8;padding-bottom:8px;margin-bottom:12px}.pdfmeta{width:100%;border-collapse:collapse}.pdfmeta td{border:1px solid #cfd8e3;padding:6px;font-size:12px}.pdfsec h2{font-size:16px;background:#eaf2fb;border-left:4px solid #356da8;padding:6px 8px}.pdfobs{border:1px solid #d7e0ea;border-radius:8px;padding:8px;margin:8px 0;font-size:12px;line-height:1.45}.pdfpar{border-left:4px solid #356da8;background:#f6f9fd;padding:10px;white-space:pre-wrap;font-size:12px;line-height:1.5}
@media(max-width:800px){.grid,.grid2,.grid3{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="wrap"><div id="app"></div></div>
<script>
const KEY='danse_spectateur_v2', ALPHA='ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
const REP=['mouvements / parties du corps','énergie / tonalité','relations entre danseurs','formations','procédés de composition','regard / intention','espace / directions / niveaux'];
const TON=['légère','lourde','grande','petite','rapide','lente','contrôlée','relâchée','saccadée','continue'];
const SPH=['près','loin du corps','haut','moyen','bas','avant','arrière','droite','gauche'];
const FORM=['ligne','diagonale','cercle','carré','V','duo / trio','amas','espacé','face-à-face','autre'];
const PROC=['répétition','accumulation','canon','unisson','contrepoint','contraste','transposition','portés','polyphonie','inversion','lâcher-rattraper','cascade'];
const AUTO=['1 idée claire','au moins 1 exemple précis','vocabulaire de danse','effet expliqué','lien au thème / intention','connecteurs','aucune appréciation sans preuve'];
let data=null, code='';

function db(){try{return JSON.parse(localStorage.getItem(KEY)||'{}')}catch(e){return {}}}
function saveDb(x){localStorage.setItem(KEY,JSON.stringify(x))}
function gen(){let d=db(),c='';do{c='';for(let i=0;i<8;i++)c+=ALPHA[Math.floor(Math.random()*ALPHA.length)]}while(d[c]);return c}
function obs(){return{moment:'',faits:'',rep:[],ton:[],sph:[],form:[],proc:[],effet:''}}
function blank(){return{meta:{spectacle:'',date:'',theme:'',duree:'',observateur:'',prenom:'',nom:'',classe:'',titre:'',musique:''},observations:[obs(),obs(),obs(),obs()],tri:{revient:'',marque:'',theme:''},prep:{intro:'',idee:'',preuve1:'',preuve2:'',effet:'',conclusion:''},paragraphe:'',auto:[]}}

function home(){app.innerHTML='<h1>FICHE SPECTATEUR & PARAGRAPHE</h1><p class="small">Sauvegarde locale sur cet appareil.</p><div class="grid2"><div class="card"><h2>Nouvelle fiche</h2><p>Un code personnel sera créé à la première sauvegarde.</p><button class="primary big" onclick="newF()">Créer une nouvelle fiche</button></div><div class="card"><h2>Reprendre une fiche</h2><label>Code personnel</label><input id="codeIn" maxlength="8" style="text-transform:uppercase"><button class="big" style="margin-top:10px" onclick="resume()">Reprendre</button><div id="resumeMsg" class="small"></div></div></div>'}
function newF(){data=blank();code='';render()}
function resume(){const c=(codeIn.value||'').toUpperCase().replace(/[^A-Z0-9]/g,'');const d=db();if(!d[c]){resumeMsg.textContent='Code introuvable sur cet appareil.';return}code=c;data=d[c];render()}
function save(){if(!code)code=gen();const d=db();d[code]=data;saveDb(d);saveStatus.textContent='Enregistré — code : '+code;alert('Code personnel : '+code)}
function autosave(){if(code){const d=db();d[code]=data;saveDb(d);saveStatus.textContent='Enregistré automatiquement — '+code}}

function render(){
app.innerHTML=`<div class="top"><div class="row"><div><b>FICHE SPECTATEUR</b><div id="saveStatus" class="status">${code?'Code : '+code:'Pas encore enregistrée'}</div></div><div><button onclick="home()">Accueil</button> <button class="primary" onclick="save()">Enregistrer</button></div></div></div><div id="ed"></div>`;
const m=data.meta;
let h=`<div class="card"><div class="grid">${field('Spectacle / groupe','meta.spectacle',m.spectacle)}${dateField('Date','meta.date',m.date)}${field('Thème annoncé','meta.theme',m.theme)}${field('Durée','meta.duree',m.duree)}${field('Observateur','meta.observateur',m.observateur)}${field('Classe','meta.classe',m.classe)}${field('Titre','meta.titre',m.titre)}${field('Musique','meta.musique',m.musique)}</div></div>
<div class="card callout"><b>Étape 1 : relever les éléments importants.</b><br>Je note d'abord ce qui est observable, puis seulement l'effet et le sens. Éviter « c'est bien / nul / beau » sans preuve.</div>`;
data.observations.forEach((o,i)=>h+=obsHtml(o,i));
h+=`<button onclick="addObs()">+ Ajouter une observation</button>
<div class="card"><h2>2. Trier ses notes</h2><div class="grid3">${area('CE QUI REVIENT','tri.revient',data.tri.revient)}${area('CE QUI MARQUE / CHANGE','tri.marque',data.tri.marque)}${area('CE QUI SERT LE THÈME','tri.theme',data.tri.theme)}</div></div>
<div class="card callout"><b>Étape 2 : exploiter les notes, justifier et rédiger.</b><br>IDÉE → PREUVE → ANALYSE → SENS → BILAN</div>
<div class="method">${mr(1,'IDÉE / POINT DE VUE','Analyser le choix du chorégraphe par rapport au thème annoncé.')}${mr(2,'PREUVE PRÉCISE','Citer un moment visible : mouvement, formation, procédé, tonalité, espace…')}${mr(3,'ANALYSE / EFFET','Expliquer ce que ce choix produit sur le spectateur.')}${mr(4,'LIEN AU THÈME / À L\'INTENTION','Montrer pourquoi cet exemple est pertinent.')}${mr(5,'BILAN / NUANCE','Conclure l\'idée ou nuancer avec une limite précise.')}</div>
<div class="card"><h2>Je prépare mes blocs</h2>${area('Mon introduction','prep.intro',data.prep.intro)}${area('Mon idée principale','prep.idee',data.prep.idee)}${area('La preuve n°1','prep.preuve1',data.prep.preuve1)}${area('La preuve n°2 éventuelle','prep.preuve2',data.prep.preuve2)}${area('L\'effet / le sens produit','prep.effet',data.prep.effet)}${area('La conclusion ou la nuance','prep.conclusion',data.prep.conclusion)}</div>
<div class="card"><h2>Je rédige mon paragraphe</h2><textarea style="min-height:240px" oninput="setp('paragraphe',this.value)">${esc(data.paragraphe)}</textarea><label>AUTO-CHECK</label>${pills(AUTO,data.auto,'auto')}</div>
<div class="card"><h2>Envoyer au professeur</h2><div class="grid2">${field('Prénom','meta.prenom',m.prenom)}${field('Nom','meta.nom',m.nom)}</div><button class="ok big" onclick="sendPdf(this)">Envoyer ma fiche PDF au professeur</button><div id="sendMsg" class="msg"></div></div>`;
ed.innerHTML=h;
}

function obsHtml(o,i){return `<details ${i===0?'open':''}><summary>Observation ${i+1}${o.moment?' — '+esc(o.moment).slice(0,60):''}</summary><div class="inner"><div class="grid2">${area('Moment — Quand ils / elles font…',`observations.${i}.moment`,o.moment)}${area('FAITS OBSERVABLES — je repère…',`observations.${i}.faits`,o.faits)}</div><label>Je repère</label>${pills(REP,o.rep,`observations.${i}.rep`)}<label>Énergie / tonalité</label>${pills(TON,o.ton,`observations.${i}.ton`)}<label>Espace / sphère</label>${pills(SPH,o.sph,`observations.${i}.sph`)}<label>Formations</label>${pills(FORM,o.form,`observations.${i}.form`)}<label>Procédés</label>${pills(PROC,o.proc,`observations.${i}.proc`)}${area('EFFET PRODUIT — ce que cela fait au spectateur',`observations.${i}.effet`,o.effet)}</div></details>`}
function addObs(){data.observations.push(obs());render();autosave()}
function mr(n,t,d){return `<div class="num">${n}</div><div class="txt"><b>${t}</b> — ${d}</div>`}
function field(l,p,v){return `<div><label>${l}</label><input value="${attr(v||'')}" oninput="setp('${p}',this.value)"></div>`}
function dateField(l,p,v){return `<div><label>${l}</label><input type="date" value="${attr(v||'')}" oninput="setp('${p}',this.value)"></div>`}
function area(l,p,v){return `<div><label>${l}</label><textarea oninput="setp('${p}',this.value)">${esc(v||'')}</textarea></div>`}
function pills(arr,sel,p){sel=sel||[];return '<div class="pillbox">'+arr.map(v=>`<label class="pill"><input type="checkbox" ${sel.includes(v)?'checked':''} onchange="tog('${p}',${JSON.stringify(v)},this.checked)"><span>${esc(v)}</span></label>`).join('')+'</div>'}
function setp(p,v){const a=p.split('.');let r=data;for(let i=0;i<a.length-1;i++)r=r[a[i]];r[a[a.length-1]]=v;autosave()}
function getp(p){return p.split('.').reduce((r,k)=>r[k],data)}
function tog(p,v,c){const a=getp(p),i=a.indexOf(v);if(c&&i<0)a.push(v);if(!c&&i>=0)a.splice(i,1);autosave()}
function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function attr(v){return esc(v)}

function buildPdf(){
 const m=data.meta, student=((m.prenom||'')+' '+(m.nom||'')).trim()||m.observateur||'';
 const obs=data.observations.map((o,i)=>`<div class="pdfobs"><b>Observation ${i+1}</b><br><b>Moment :</b> ${esc(o.moment)}<br><b>Faits observables :</b> ${esc(o.faits)}<br><b>Vocabulaire :</b> ${esc([...(o.rep||[]),...(o.ton||[]),...(o.sph||[]),...(o.form||[]),...(o.proc||[])].join(', '))}<br><b>Effet :</b> ${esc(o.effet)}</div>`).join('');
 const d=document.createElement('div');d.className='pdfstage';d.innerHTML=`<div class="pdfpage"><div class="pdftitle">FICHE SPECTATEUR — DANSE</div><table class="pdfmeta"><tr><td>Élève / observateur</td><td>${esc(student)}</td><td>Classe</td><td>${esc(m.classe)}</td></tr><tr><td>Spectacle / groupe</td><td>${esc(m.spectacle)}</td><td>Date</td><td>${esc(m.date)}</td></tr><tr><td>Titre</td><td>${esc(m.titre)}</td><td>Durée</td><td>${esc(m.duree)}</td></tr><tr><td>Thème annoncé</td><td>${esc(m.theme)}</td><td>Musique</td><td>${esc(m.musique)}</td></tr></table><div class="pdfsec"><h2>1. Prendre des notes</h2>${obs}</div><div class="pdfsec"><h2>2. Trier ses notes</h2><p><b>Ce qui revient :</b> ${esc(data.tri.revient)}</p><p><b>Ce qui marque / change :</b> ${esc(data.tri.marque)}</p><p><b>Ce qui sert le thème :</b> ${esc(data.tri.theme)}</p></div><div class="pdfsec"><h2>3. Préparer le paragraphe</h2><p><b>Introduction :</b> ${esc(data.prep.intro)}</p><p><b>Idée principale :</b> ${esc(data.prep.idee)}</p><p><b>Preuve 1 :</b> ${esc(data.prep.preuve1)}</p><p><b>Preuve 2 :</b> ${esc(data.prep.preuve2)}</p><p><b>Effet / sens :</b> ${esc(data.prep.effet)}</p><p><b>Conclusion / nuance :</b> ${esc(data.prep.conclusion)}</p></div><div class="pdfsec"><h2>4. Paragraphe critique</h2><div class="pdfpar">${esc(data.paragraphe)}</div></div></div>`;document.body.appendChild(d);return d;
}
async function makePdfBlob(){if(typeof html2pdf==='undefined')throw new Error('Module PDF indisponible.');if(!code){code=gen();const d=db();d[code]=data;saveDb(d)}const node=buildPdf();try{const worker=html2pdf().set({margin:0,image:{type:'jpeg',quality:.96},html2canvas:{scale:2,useCORS:true,backgroundColor:'#fff'},jsPDF:{unit:'pt',format:'a4',orientation:'portrait'},pagebreak:{mode:['css','legacy']}}).from(node).toPdf();const pdf=await worker.get('pdf');return pdf.output('blob')}finally{node.remove()}}
async function sendPdf(btn){
 const m=data.meta;if(!((m.prenom||m.observateur)&&m.classe)){alert('Renseigne au minimum le prénom / observateur et la classe.');return}
 const msg=sendMsg;btn.disabled=true;msg.className='msg wait';msg.textContent='Création et envoi du PDF…';
 try{
   const blob=await makePdfBlob();
   const identity=((m.nom||'')+' '+(m.prenom||'')).trim()||m.observateur||'Élève';
   const safe=identity.normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-zA-Z0-9_-]+/g,'_').replace(/^_+|_+$/g,'')||'eleve';
   const recipient=atob('YWJpbGFlcHNAZ21haWwuY29t');
   const fd=new FormData();
   fd.append('_subject',identity+' - fiche observateur danse');
   fd.append('_captcha','false');
   fd.append('attachment',new File([blob],safe+'_fiche_observateur_danse.pdf',{type:'application/pdf'}));
   const r=await fetch('https://formsubmit.co/ajax/'+recipient,{method:'POST',headers:{Accept:'application/json'},body:fd});
   let j={};try{j=await r.json()}catch(e){}
   if(!r.ok||j.success===false)throw new Error(j.message||'Le service d’envoi a refusé la demande.');
   msg.className='msg ok';msg.textContent='✓ FICHE PDF ENVOYÉE AU PROFESSEUR';
 }catch(e){msg.className='msg err';msg.textContent='Envoi impossible : '+e.message}
 btn.disabled=false;
}
home();
</script>
</body>
</html>
