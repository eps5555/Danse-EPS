<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Fiche chorégraphe</title><style>
:root{--bg:#f4f7fb;--card:#fff;--ink:#17212b;--muted:#687684;--line:#d7e0ea;--blue:#356da8;--soft:#eaf2fb;--ok:#18765e;--danger:#b83232;--r:16px}*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:var(--bg);color:var(--ink)}.wrap{max-width:1100px;margin:auto;padding:14px 14px 80px}.header{position:sticky;top:0;z-index:20;background:rgba(244,247,251,.95);backdrop-filter:blur(8px);border-bottom:1px solid var(--line);padding:10px 0;margin-bottom:14px}.row{display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap}h1{font-size:clamp(26px,6vw,42px);margin:18px 0 6px}h2{font-size:21px;margin:0}.card{background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:16px;box-shadow:0 6px 22px rgba(20,40,70,.06)}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.meta{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.btn{border:0;border-radius:11px;padding:10px 14px;font-weight:700;background:#e5ebf2;color:#213249;cursor:pointer}.btn.primary{background:var(--blue);color:#fff}.btn.ok{background:var(--ok);color:#fff}.btn.danger{background:#fff0f0;color:var(--danger);border:1px solid #f1c9c9}.btn.big{width:100%;padding:14px;font-size:17px}label{font-weight:700;font-size:13px;display:block;margin:8px 0 5px}input[type=text],input[type=date],input[type=number],textarea{width:100%;border:1px solid #c7d2dd;border-radius:10px;padding:10px;background:#fff;color:var(--ink);font:inherit}textarea{min-height:78px;resize:vertical}.small{font-size:12px;color:var(--muted)}.section{margin:25px 0 10px;display:flex;justify-content:space-between;align-items:center;gap:10px}.pills{display:flex;flex-wrap:wrap;gap:7px}.pill{position:relative}.pill input{position:absolute;opacity:0}.pill span{display:inline-block;border:1px solid #cfd8e3;border-radius:999px;padding:7px 10px;background:#fff;font-size:13px}.pill input:checked+span{background:var(--soft);border-color:#79a4d0;color:#174b80;font-weight:700}details{background:#fff;border:1px solid var(--line);border-radius:14px;margin:10px 0;overflow:hidden}summary{cursor:pointer;font-weight:800;padding:13px 15px;background:#f9fbfd}.inner{padding:14px}.moves{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.move{border:1px solid var(--line);border-radius:12px;padding:8px;background:#fbfcfe}.n{font-weight:800;font-size:12px;color:var(--muted);margin-bottom:6px}canvas{display:block;width:100%;height:105px;background:#fff;border:1px dashed #aab8c5;border-radius:8px;touch-action:none}.mini{font-size:11px;padding:5px 8px;border:1px solid var(--line);background:#fff;border-radius:8px;cursor:pointer;margin-top:5px}.sub{padding-top:12px;margin-top:12px;border-top:1px solid #edf1f5}.sub h4{margin:0 0 7px}.formations,.procs{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.form,.proc{border:1px solid var(--line);border-radius:12px;padding:9px;background:#fff}.diag{white-space:pre;text-align:center;font-family:monospace;min-height:30px;color:#32485e}.formline{display:flex;align-items:center;gap:6px}.formline input[type=number]{width:58px;padding:5px}.proc b{display:block;margin-bottom:4px}.proc small{display:block;line-height:1.35;color:var(--muted)}.method{display:grid;grid-template-columns:42px 1fr;border:1px solid var(--line);border-radius:12px;overflow:hidden}.method .num{background:#4f79aa;color:#fff;font-weight:800;display:flex;align-items:center;justify-content:center;border-bottom:1px solid rgba(255,255,255,.25)}.method .txt{padding:10px;background:#fff;border-bottom:1px solid var(--line)}.callout{border-left:4px solid var(--blue);background:#eef5fd;border-radius:8px;padding:12px}.code{font-size:28px;font-weight:900;letter-spacing:4px;text-align:center;background:#102b46;color:#fff;border-radius:12px;padding:12px}.modal{position:fixed;inset:0;z-index:100;background:rgba(10,20,30,.5);display:flex;align-items:center;justify-content:center;padding:18px}.modal.hide{display:none}.modalbox{background:#fff;border-radius:18px;max-width:440px;width:100%;padding:20px}.status{font-size:12px;color:var(--muted)}@media(max-width:820px){.grid2,.grid3,.meta{grid-template-columns:1fr}.moves,.formations,.procs{grid-template-columns:repeat(2,1fr)}}@media(max-width:480px){.wrap{padding:10px 10px 60px}.moves,.formations,.procs{grid-template-columns:1fr}}
</style></head><body><div class="wrap"><div id="app"></div></div><div id="modal" class="modal hide"><div class="modalbox"><h2>Code personnel</h2><p>Conserve ce code pour reprendre la fiche sur <b>ce même appareil et ce même navigateur</b>.</p><div id="mcode" class="code"></div><button class="btn primary big" style="margin-top:12px" onclick="closeModal()">Continuer</button></div></div><script>
const K='danse_choregraphe_v1',A='ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
const TON=['fluide','saccadé','léger','lourd','continu','haché','direct','indirect'];
const PROC=['répétition','accumulation','canon','unisson','contrepoint','contraste','transposition','portés / contrepoids','polyphonie','inversion','lâcher-rattraper','cascade'];
const CORPS=['tête','bras','buste','bassin','jambes','corps entier','près','loin','haut','moyen','bas','avant / arrière','droite / gauche'];
const FORM=['ligne','diagonale','cercle','carré / rectangle','V','duo / trio','amas / resserré','quinconce','face-à-face','dos-à-dos','1 danseur isolé','autre'];
const FD={'ligne':'● ● ● ●','diagonale':'●\\n  ●\\n    ●','cercle':' ● ●\\n●   ●\\n ●','carré / rectangle':'●   ●\\n●   ●','V':'●     ●\\n  ● ●\\n   ●','duo / trio':'●● / ●●●','amas / resserré':' ●●●\\n  ●●','quinconce':'●   ●\\n  ●   ●','face-à-face':'● →   ← ●','dos-à-dos':'← ●   ● →','1 danseur isolé':'●      ●●●','autre':'…'};
const PINFO=[['Répétition','Reprendre le même motif','Insister, obsession, repère'],['Accumulation','Ajouter un élément à chaque reprise','Montée en puissance'],['Canon','Même mouvement décalé dans le temps','Propagation, poursuite'],['Unisson','Tous ensemble','Unité, norme, force'],['Contrepoint','Actions différentes en même temps','Conflit, double lecture'],['Contraste','Opposer tonalités / espaces / rythmes','Choc, bascule'],['Transposition','Reprendre une idée ailleurs','Transformation'],['Cascade','Succession rapide avec décalage','Effet de hola / succession'],['Inversion','Refaire en arrière : magnétoscope','Renversement'],['Polyphonie','Chaque danseur réalise une phrase différente','Cacophonie gestuelle structurée'],['Portés / Contrepoids','Mettre tout ou partie du poids sur un autre danseur','Relation de poids / appui'],['Lâcher-Rattraper','Quitter puis récupérer la séquence là où elle se trouve','Rupture puis retour']];
let data=null,code='',canv={};
function db(){try{return JSON.parse(localStorage.getItem(K)||'{}')}catch(e){return {}}}function saveDb(d){localStorage.setItem(K,JSON.stringify(d))}function gen(){let d=db(),c='';do{c='';for(let i=0;i<8;i++)c+=A[Math.floor(Math.random()*A.length)]}while(d[c]);return c}
function blank(){return{meta:{groupe:'',classe:'',theme:'',titre:''},phrases:Array.from({length:8},()=>({intention:'',mouvements:Array.from({length:8},()=>({note:'',strokes:[]})),tonalites:[],procedes:[],corps:[],formations:{}})),fil:{theme:'',ressenti:'',motif:'',debut:'',bascule:'',fin:''},sym:{s1:'',s2:'',s3:'',vis:[]},ton:{dom:[],sphere:[],contrastes:[]},procedes:[],formations:{},verif:[],choix:'',pourquoi:''}}
function home(){app.innerHTML=`<h1>FICHE CHORÉGRAPHE</h1><p class="small">HTML autonome — sauvegarde sur cet appareil.</p><div class="grid2"><div class="card"><h2>Nouvelle fiche</h2><p>Un code personnel sera créé à la première sauvegarde.</p><button class="btn primary big" onclick="newF()">Créer</button></div><div class="card"><h2>Reprendre une fiche</h2><label>Code personnel</label><input id="c" type="text" maxlength="8" style="text-transform:uppercase"><button class="btn big" style="margin-top:10px" onclick="resume()">Reprendre</button><div id="msg" class="small"></div></div></div>`}
function newF(){data=blank();code='';render()}function resume(){let c=(document.getElementById('c').value||'').toUpperCase().replace(/[^A-Z0-9]/g,''),d=db();if(!d[c]){msg.textContent='Code introuvable sur cet appareil.';return}code=c;data=d[c];render()}
function save(show=true){if(!code)code=gen();let d=db();d[code]=data;saveDb(d);st.textContent='Enregistré — code : '+code;if(show){mcode.textContent=code;modal.classList.remove('hide')}}function autosave(){if(code){let d=db();d[code]=data;saveDb(d);st.textContent='Enregistré automatiquement — '+code}}function closeModal(){modal.classList.add('hide')}
function render(){app.innerHTML=`<div class="header"><div class="row"><div><b>FICHE CHORÉGRAPHE</b><div id="st" class="status">${code?'Code : '+code:'Pas encore enregistrée'}</div></div><div><button class="btn" onclick="home()">Accueil</button> <button class="btn primary" onclick="save()">Enregistrer</button></div></div></div><div id="ed"></div>`;let m=data.meta,h=`<div class="card"><div class="meta">${fld('Groupe','meta.groupe',m.groupe)}${fld('Classe','meta.classe',m.classe)}${fld('Thème','meta.theme',m.theme)}${fld('Titre','meta.titre',m.titre)}</div></div><div class="section"><h2>Mes phrases chorégraphiques</h2><span class="small">1 case = 1 mouvement ou moment clé.</span></div>`;data.phrases.forEach((p,i)=>h+=phrase(p,i));h+=`<div class="section"><h2>Mon fil rouge</h2></div><div class="grid3"><div class="card"><h2>1. MON FIL ROUGE</h2>${area('Thème','fil.theme',data.fil.theme)}${area('Ce que je veux faire ressentir','fil.ressenti',data.fil.ressenti)}${area('Motif-signature / geste qui revient','fil.motif',data.fil.motif)}<div class="grid3">${area('Début','fil.debut',data.fil.debut)}${area('Bascule','fil.bascule',data.fil.bascule)}${area('Fin','fil.fin',data.fil.fin)}</div></div><div class="card"><h2>2. MES SYMBOLES / IMAGES</h2>${fld('Symbole / image 1','sym.s1',data.sym.s1)}${fld('Symbole / image 2','sym.s2',data.sym.s2)}${fld('Symbole / image 3','sym.s3',data.sym.s3)}<label>Comment les rendre visibles ?</label>${pills(['geste','formation','regard','niveau','espace','relation entre danseurs'],data.sym.vis,'sym.vis')}</div><div class="card"><h2>3. MES TONALITÉS</h2><label>Tonalités dominantes</label>${pills(['légère','lourde','grande','petite','rapide','lente','contrôlée','relâchée','saccadée','continue'],data.ton.dom,'ton.dom')}<label>Sphère du mouvement</label>${pills(['près','loin du corps','haut','moyen','bas','avant','arrière','droite','gauche'],data.ton.sphere,'ton.sphere')}<label>Contraste principal recherché</label>${pills(['fluide / saccadé','léger / lourd','continu / haché','direct / indirect','suspendu / relâché','explosif / retenu'],data.ton.contrastes,'ton.contrastes')}</div></div><div class="section"><h2>4. PROCÉDÉS DE COMPOSITION</h2></div><div class="procs">${PINFO.map(x=>`<label class="proc"><b><input type="checkbox" ${data.procedes.includes(x[0])?'checked':''} onchange="tog('procedes',${JSON.stringify(x[0])},this.checked)"> ${x[0]}</b><small>${x[1]}</small><small><i>Effet : ${x[2]}</i></small></label>`).join('')}</div><div class="section"><h2>5. FORMATIONS DE DANSEURS</h2></div><div class="formations">${forms('formations',data.formations)}</div><div class="section"><h2>6. VÉRIFICATION AVANT DE PRÉSENTER</h2></div><div class="card">${pills(['thème lisible','motif-signature identifiable','formations variées','espace utilisé','niveaux variés','procédés visibles','transitions nettes','début clair','fin claire','aucun temps mort','sécurité / placements maîtrisés'],data.verif,'verif')}<div class="grid2">${fld('Notre choix le plus important','choix',data.choix)}${fld('Parce que','pourquoi',data.pourquoi)}</div></div>`;ed.innerHTML=h;setTimeout(initCanvas,0)}
function phrase(p,i){return `<details ${i===0?'open':''} ontoggle="if(this.open)setTimeout(initCanvas,0)"><summary>PHRASE ${i+1}${p.intention?' — '+esc(p.intention).slice(0,60):''}</summary><div class="inner">${fld('Idée / intention',`phrases.${i}.intention`,p.intention)}<div class="moves">${p.mouvements.map((m,j)=>`<div class="move"><div class="n">MOUVEMENT ${j+1}</div><canvas width="320" height="180" data-c="${i}-${j}"></canvas><button class="mini" onclick="clearC(${i},${j})">Effacer le dessin</button><textarea placeholder="Ou noter très brièvement…" oninput="setp('phrases.${i}.mouvements.${j}.note',this.value)">${esc(m.note||'')}</textarea></div>`).join('')}</div><div class="sub"><h4>TONALITÉ</h4>${pills(TON,p.tonalites,`phrases.${i}.tonalites`)}</div><div class="sub"><h4>PROCÉDÉS</h4>${pills(PROC,p.procedes,`phrases.${i}.procedes`)}</div><div class="sub"><h4>CORPS / SPHÈRE</h4>${pills(CORPS,p.corps,`phrases.${i}.corps`)}</div><div class="sub"><h4>FORMATIONS (n°)</h4><div class="formations">${forms(`phrases.${i}.formations`,p.formations)}</div></div></div></details>`}
function fld(l,p,v){return `<div><label>${l}</label><input type="text" value="${attr(v||'')}" oninput="setp('${p}',this.value)"></div>`}function area(l,p,v){return `<div><label>${l}</label><textarea oninput="setp('${p}',this.value)">${esc(v||'')}</textarea></div>`}function pills(a,s,p){s=s||[];return `<div class="pills">${a.map(v=>`<label class="pill"><input type="checkbox" ${s.includes(v)?'checked':''} onchange="tog('${p}',${JSON.stringify(v)},this.checked)"><span>${esc(v)}</span></label>`).join('')}</div>`}function forms(p,o){o=o||{};return FORM.map(f=>{let e=o[f]||{used:false,order:''};return `<div class="form"><div class="formline"><input type="checkbox" ${e.used?'checked':''} onchange="sf('${p}',${JSON.stringify(f)},'used',this.checked)"><b>${esc(f)}</b><input type="number" min="1" value="${attr(e.order||'')}" placeholder="n°" oninput="sf('${p}',${JSON.stringify(f)},'order',this.value)"></div><div class="diag">${FD[f]}</div></div>`}).join('')}
function setp(p,v){let a=p.split('.'),r=data;for(let i=0;i<a.length-1;i++)r=r[a[i]];r[a[a.length-1]]=v;autosave()}function getp(p){return p.split('.').reduce((r,k)=>r[k],data)}function tog(p,v,c){let a=getp(p),i=a.indexOf(v);if(c&&i<0)a.push(v);if(!c&&i>=0)a.splice(i,1);autosave()}function sf(p,n,k,v){let o=getp(p);if(!o[n])o[n]={used:false,order:''};o[n][k]=v;autosave()}
function initCanvas(){document.querySelectorAll('canvas[data-c]').forEach(c=>{if(c.dataset.r)return;c.dataset.r='1';let [pi,mi]=c.dataset.c.split('-').map(Number),ctx=c.getContext('2d');ctx.lineWidth=3;ctx.lineCap='round';ctx.strokeStyle='#17212b';let draw=false,s=null;const P=e=>{let r=c.getBoundingClientRect();return[(e.clientX-r.left)/r.width,(e.clientY-r.top)/r.height]};const redraw=()=>{ctx.clearRect(0,0,c.width,c.height);(data.phrases[pi].mouvements[mi].strokes||[]).forEach(st=>{if(!st.length)return;ctx.beginPath();ctx.moveTo(st[0][0]*c.width,st[0][1]*c.height);for(let q=1;q<st.length;q++)ctx.lineTo(st[q][0]*c.width,st[q][1]*c.height);ctx.stroke()})};c.addEventListener('pointerdown',e=>{e.preventDefault();draw=true;s=[P(e)];data.phrases[pi].mouvements[mi].strokes.push(s)});c.addEventListener('pointermove',e=>{if(!draw)return;e.preventDefault();let p=P(e),l=s[s.length-1];s.push(p);ctx.beginPath();ctx.moveTo(l[0]*c.width,l[1]*c.height);ctx.lineTo(p[0]*c.width,p[1]*c.height);ctx.stroke()});window.addEventListener('pointerup',()=>{if(draw){draw=false;autosave()}});canv[`${pi}-${mi}`]={redraw};redraw()})}function clearC(i,j){data.phrases[i].mouvements[j].strokes=[];if(canv[`${i}-${j}`])canv[`${i}-${j}`].redraw();autosave()}
function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function attr(v){return esc(v).replace(/`/g,'&#96;')}home();
</script></body></html>
